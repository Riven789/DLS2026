# Save as ~/.codex/config.toml (the USER-level Codex config that Codex
# auto-loads), not as a project-local .codex/config.toml (Codex ignores
# provider/auth routing there). Export DLS_QWEN_API_KEY in your shell.
# Current Codex (>=0.158) requires wire_api="responses"; it no longer supports
# wire_api="chat" (ref openai/codex#7782). Chicago-6's LiteLLM serves a native
# /v1/responses bridge, so this works end-to-end (piloted on Linux).
model = "qwen3.8-27b"
model_provider = "dls_qwen"
model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[model_providers.dls_qwen]
name = "CMSC 35200 Chicago-6 Qwen3.8-27B"
base_url = "http://209.182.219.81:4010/v1"
wire_api = "responses"
env_key = "DLS_QWEN_API_KEY"
